name: Deploy TallerOS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Deploy al servidor via Cloudflare SSH
        uses: appleboy/ssh-action@master
        with:
          host: ssh.armracing.com
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          proxy_host: ssh.armracing.com
          port: 22
          script: |
            cd /home/arturo/ecosistema-tecnologico
            git pull origin main
            docker compose build taller_backend taller_frontend
            docker compose up -d
            echo "Deploy completado: $(date)"
