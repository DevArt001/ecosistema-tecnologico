services:
  taller_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taller_db
      POSTGRES_USER: taller_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mi_clave_secreta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taller_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller_user -d taller_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  taller_backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - media_files:/app/ordenes
    depends_on:
      taller_db:
        condition: service_healthy
    environment:
      DB_NAME: taller_db
      DB_USER: taller_user
      DB_PASSWORD: ${DB_PASSWORD:-mi_clave_secreta}
      DB_HOST: taller_db
      DB_PORT: 5432
      DEBUG: "False"
    networks:
      - taller_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  taller_frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      taller_backend:
        condition: service_healthy
    networks:
      - taller_net

volumes:
  postgres_data:
  media_files:

networks:
  taller_net:
    driver: bridge
